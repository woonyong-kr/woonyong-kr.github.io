name: Verify and deploy WN Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and adapter
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/runnable-code-blocks/package-lock.json
      - name: Install site and adapter build dependencies
        run: |
          npm ci
          npm --prefix vendor/runnable-code-blocks ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Verify production build
        run: npm run verify
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
