  </button>
</div>
<script>
  (function () {
    var desktopToggle = document.getElementById("theme-toggle");
    var mobileToggle;

    function createMobileControls() {
      var desktopControls = document.querySelector(".main-header .wn-header-actions");
      var siteHeader = document.querySelector(".site-header");
      var menuButton = document.getElementById("menu-button");

      if (!desktopControls || !siteHeader || !menuButton || document.getElementById("theme-toggle-mobile")) {
        return null;
      }

      var mobileControls = desktopControls.cloneNode(true);
      mobileControls.classList.add("wn-mobile-header-actions");
      mobileControls.setAttribute("aria-label", "Site controls");

      var toggle = mobileControls.querySelector(".wn-header-action--theme");
      toggle.id = "theme-toggle-mobile";
      siteHeader.insertBefore(mobileControls, menuButton);
      return toggle;
    }

    function renderTheme(toggle, theme) {
      var nextTheme = theme === "dark" ? "light" : "dark";
      toggle.setAttribute("aria-pressed", String(theme === "dark"));
      toggle.setAttribute("aria-label", "Switch to " + nextTheme + " mode");
      toggle.setAttribute("title", "Switch to " + nextTheme + " mode");
    }

    function bindThemeToggle(toggle) {
      if (!toggle) {
        return;
      }

      renderTheme(toggle, window.wnTheme.getCurrentTheme());
      window.addEventListener("wn-theme-change", function (event) {
        renderTheme(toggle, event.detail.theme);
      });
      toggle.addEventListener("click", function () {
        window.wnTheme.toggle();
      });
    }

    mobileToggle = createMobileControls();
    bindThemeToggle(desktopToggle);
    bindThemeToggle(mobileToggle);

    function revealControls() {
      window.requestAnimationFrame(function () {
        document.documentElement.classList.add("wn-ui-ready");
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", revealControls, { once: true });
    } else {
      revealControls();
    }
  })();
</script>
