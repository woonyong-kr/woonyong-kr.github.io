{% assign wn_assets_revision = site.github.build_revision | default: site.time | date: "%s" %}
<style>
  html[data-wn-theme="light"], html[data-wn-theme="light"] body { background-color: #ffffff; }
  html[data-wn-theme="dark"], html[data-wn-theme="dark"] body { background-color: #27262b; }
  html:not(.wn-ui-ready) .wn-header-actions { visibility: hidden; }
</style>
<script>
  (function () {
    var systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
    var manuallySelected = false;
    var currentTheme = null;

    function applyTheme(isDark, withTransition) {
      if (withTransition) document.documentElement.classList.add("wn-theme-transition");
      currentTheme = isDark ? "dark" : "light";
      document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      document.documentElement.dataset.wnTheme = currentTheme;
      window.jtd.setTheme(isDark ? "woon-dark" : "woon-light");
      window.dispatchEvent(new CustomEvent("wn-theme-change", { detail: { theme: currentTheme } }));
      if (withTransition) window.setTimeout(function () {
        document.documentElement.classList.remove("wn-theme-transition");
      }, 180);
    }

    function applySystemTheme(event) {
      if (!manuallySelected) applyTheme(event.matches);
    }

    window.wnTheme = {
      getCurrentTheme: function () { return currentTheme; },
      toggle: function () {
        manuallySelected = true;
        applyTheme(currentTheme !== "dark", true);
      }
    };

    applyTheme(systemTheme.matches);
    systemTheme.addEventListener("change", applySystemTheme);
  })();
</script>
<link rel="stylesheet" href="{{ '/assets/css/runnable-code-blocks.css' | relative_url }}?v={{ wn_assets_revision }}">
<link rel="stylesheet" href="{{ '/assets/css/runnable-code-blocks-host.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/wn-header-actions.css' | relative_url }}?v={{ wn_assets_revision }}">
<script>
  (function () {
    function createElement(parent, tag, options, callback) {
      var document_ = parent.nodeType === Node.DOCUMENT_NODE ? parent : parent.ownerDocument;
      var element = document_.createElement(tag);
      var info = typeof options === "string" ? { cls: options } : options || {};
      if (info.cls) element.className = Array.isArray(info.cls) ? info.cls.join(" ") : info.cls;
      if (info.text !== undefined) element.textContent = info.text;
      parent.append(element);
      if (callback) callback(element);
      return element;
    }

    Node.prototype.createEl = function (tag, options, callback) {
      return createElement(this, tag, options, callback);
    };
    Node.prototype.createDiv = function (options, callback) {
      return createElement(this, "div", options, callback);
    };
    Node.prototype.createSpan = function (options, callback) {
      return createElement(this, "span", options, callback);
    };
    Node.prototype.createSvg = function (tag, options, callback) {
      var document_ = this.nodeType === Node.DOCUMENT_NODE ? this : this.ownerDocument;
      var element = document_.createElementNS("http://www.w3.org/2000/svg", tag);
      var info = typeof options === "string" ? { cls: options } : options || {};
      if (info.cls) element.setAttribute("class", Array.isArray(info.cls) ? info.cls.join(" ") : info.cls);
      this.append(element);
      if (callback) callback(element);
      return element;
    };
    window.rcbFetch = window.fetch.bind(window);
  })();
</script>
<script type="module" src="{{ '/assets/js/runnable-code-blocks.js' | relative_url }}?v={{ wn_assets_revision }}"></script>
