<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"
     font-family="'Noto Sans KR','Noto Sans CJK KR',sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="60" y="90" font-size="36" font-weight="bold" fill="#2f3733">AI 복구의 권한 경계 · 게이트를 전부 통과해야 Draft PR 하나</text>
  <text x="60" y="130" font-size="20" fill="#6a716d">에이전트는 클러스터를 직접 바꿀 수 없고, 어긋나면 각 게이트에서 fail-closed</text>

  <!-- 영역 구분 -->
  <line x1="520" y1="170" x2="520" y2="790" stroke="#d9dde0" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="1120" y1="170" x2="1120" y2="790" stroke="#d9dde0" stroke-width="2" stroke-dasharray="8 6"/>

  <text x="290" y="205" text-anchor="middle" font-size="24" font-weight="bold" fill="#6a716d">대상 클러스터</text>
  <text x="820" y="205" text-anchor="middle" font-size="24" font-weight="bold" fill="#6a716d">제어면 · 게이트 3개</text>
  <text x="1360" y="205" text-anchor="middle" font-size="24" font-weight="bold" fill="#6a716d">GitHub</text>

  <!-- A. 클러스터 에이전트 -->
  <rect x="90" y="300" width="400" height="170" rx="10" fill="#f4f6f5" stroke="#8a918d" stroke-width="2"/>
  <text x="290" y="350" text-anchor="middle" font-size="26" font-weight="bold" fill="#2f3733">cluster-agent</text>
  <text x="290" y="392" text-anchor="middle" font-size="21" fill="#2f3733">읽기 전용, get · list · watch 만</text>
  <text x="290" y="428" text-anchor="middle" font-size="19" fill="#6a716d">쓰기 verb · exec · portforward 없음</text>

  <!-- 위 상자에 딸린 주석. 떠 있으면 남은 글자로 읽혀서 면을 깔아 묶는다. -->
  <rect x="90" y="500" width="400" height="80" rx="8" fill="#f4f6f5"/>
  <rect x="90" y="500" width="4" height="80" fill="#8a918d"/>
  <text x="298" y="534" text-anchor="middle" font-size="19" fill="#6a716d">RBAC 은 Helm 렌더 결과를</text>
  <text x="298" y="562" text-anchor="middle" font-size="19" fill="#6a716d">정적 게이트로 한 번 더 검사</text>

  <line x1="490" y1="385" x2="560" y2="385" stroke="#02a76a" stroke-width="3"/>
  <polygon points="560,385 546,377 546,393" fill="#02a76a"/>
  <text x="527" y="360" text-anchor="middle" font-size="17" fill="#027f50">증거만</text>

  <!-- B. 게이트 3개 -->
  <rect x="580" y="250" width="480" height="130" rx="10" fill="#ffffff" stroke="#2f3733" stroke-width="2"/>
  <text x="820" y="288" text-anchor="middle" font-size="23" font-weight="bold" fill="#2f3733">① Patch Allowlist</text>
  <text x="820" y="322" text-anchor="middle" font-size="19" fill="#2f3733">action 6종 · Deployment 한정</text>
  <text x="820" y="352" text-anchor="middle" font-size="19" fill="#6a716d">replica ≤ 10 · memory ≤ 4GiB · 역패치 완전 일치</text>

  <line x1="820" y1="380" x2="820" y2="415" stroke="#2f3733" stroke-width="2.5"/>
  <polygon points="820,415 812,402 828,402" fill="#2f3733"/>

  <rect x="580" y="420" width="480" height="100" rx="10" fill="#ffffff" stroke="#2f3733" stroke-width="2"/>
  <text x="820" y="458" text-anchor="middle" font-size="23" font-weight="bold" fill="#2f3733">② Delivery 정책</text>
  <text x="820" y="492" text-anchor="middle" font-size="19" fill="#2f3733">pull_request 외 모든 전달 경로 거부</text>

  <line x1="820" y1="520" x2="820" y2="555" stroke="#2f3733" stroke-width="2.5"/>
  <polygon points="820,555 812,542 828,542" fill="#2f3733"/>

  <rect x="580" y="560" width="480" height="100" rx="10" fill="#ffffff" stroke="#2f3733" stroke-width="2"/>
  <text x="820" y="598" text-anchor="middle" font-size="23" font-weight="bold" fill="#2f3733">③ Base SHA 재검증</text>
  <text x="820" y="632" text-anchor="middle" font-size="19" fill="#2f3733">PR 생성 직전 재확인, 어긋나면 중단</text>

  <!-- C. GitHub -->
  <line x1="1060" y1="610" x2="1180" y2="610" stroke="#02a76a" stroke-width="3"/>
  <polygon points="1180,610 1166,602 1166,618" fill="#02a76a"/>

  <rect x="1190" y="540" width="340" height="140" rx="10" fill="#eefaf4" stroke="#02a76a" stroke-width="2.5"/>
  <text x="1360" y="588" text-anchor="middle" font-size="26" font-weight="bold" fill="#027f50">Draft PR (강제)</text>
  <text x="1360" y="624" text-anchor="middle" font-size="19" fill="#2f3733">응답이 draft 가 아니면 거부</text>
  <text x="1360" y="654" text-anchor="middle" font-size="19" fill="#6a716d">merge API 호출 경로 자체가 없음</text>

  <rect x="1190" y="300" width="340" height="120" rx="10" fill="#f4f6f5" stroke="#8a918d" stroke-width="2"/>
  <text x="1360" y="345" text-anchor="middle" font-size="23" font-weight="bold" fill="#2f3733">사람의 리뷰 · 머지</text>
  <text x="1360" y="382" text-anchor="middle" font-size="19" fill="#6a716d">머지 웹훅은 서명 검증 후 관측만</text>

  <line x1="1360" y1="540" x2="1360" y2="420" stroke="#8a918d" stroke-width="2.5"/>
  <polygon points="1360,420 1352,433 1368,433" fill="#8a918d"/>

  <!-- 하단 -->
  <line x1="60" y1="790" x2="1540" y2="790" stroke="#d9dde0" stroke-width="2"/>
  <text x="800" y="840" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f3733">경계마다 계약 테스트 45종으로 고정, 경계가 느슨해지면 빌드가 실패</text>
</svg>
