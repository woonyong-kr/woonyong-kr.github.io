<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- title -->
  <text x="60" y="105" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="36" font-weight="bold" fill="#2f3733">범위 조회, 규모가 커져도 무너지지 않게</text>

  <!-- legend -->
  <line x1="1010" y1="104" x2="1060" y2="104" stroke="#02a76a" stroke-width="4"/>
  <text x="1075" y="110" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="18" fill="#2f3733">인덱스 범위 스캔 O(log N + k)</text>
  <line x1="1010" y1="139" x2="1060" y2="139" stroke="#8a918d" stroke-width="4"/>
  <text x="1075" y="145" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="18" fill="#2f3733">힙 스캔 O(N)</text>
  <line x1="1010" y1="174" x2="1060" y2="174" stroke="#8a918d" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="1075" y="180" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="18" fill="#2f3733">참고: PostgreSQL fsync=off</text>

  <!-- axes -->
  <line x1="240" y1="205" x2="240" y2="700" stroke="#d9dde0" stroke-width="2"/>
  <line x1="240" y1="700" x2="1380" y2="700" stroke="#d9dde0" stroke-width="2"/>
  <text x="240" y="188" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="16" fill="#6a716d">ops/sec</text>

  <!-- x tick labels -->
  <text x="300" y="738" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="18" fill="#6a716d">10k</text>
  <text x="800" y="738" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="18" fill="#6a716d">100k</text>
  <text x="1300" y="738" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="18" fill="#6a716d">1M</text>
  <text x="810" y="782" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="20" fill="#6a716d">행 수</text>

  <!-- gray heap-scan curve (plunges) -->
  <path d="M300,353 C500,420 650,560 800,614 C950,660 1150,685 1300,690" fill="none" stroke="#8a918d" stroke-width="4" stroke-linecap="round"/>
  <!-- dashed PostgreSQL reference -->
  <path d="M300,415 C500,440 650,458 800,466 C950,472 1150,475 1300,477" fill="none" stroke="#8a918d" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>
  <!-- green index-scan curve (gentle) -->
  <path d="M300,237 C466,241 633,245 800,249 C966,252 1133,256 1300,259" fill="none" stroke="#02a76a" stroke-width="4" stroke-linecap="round"/>

  <!-- points -->
  <circle cx="300" cy="237" r="7" fill="#02a76a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="800" cy="249" r="7" fill="#02a76a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1300" cy="259" r="7" fill="#02a76a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="300" cy="353" r="7" fill="#8a918d" stroke="#ffffff" stroke-width="2"/>
  <circle cx="800" cy="614" r="7" fill="#8a918d" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1300" cy="690" r="7" fill="#8a918d" stroke="#ffffff" stroke-width="2"/>
  <circle cx="300" cy="415" r="5" fill="#ffffff" stroke="#8a918d" stroke-width="2"/>
  <circle cx="800" cy="466" r="5" fill="#ffffff" stroke="#8a918d" stroke-width="2"/>
  <circle cx="1300" cy="477" r="5" fill="#ffffff" stroke="#8a918d" stroke-width="2"/>

  <!-- value labels: green -->
  <text x="300" y="214" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="18" font-weight="bold" fill="#02a76a">3,374</text>
  <text x="800" y="226" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="18" font-weight="bold" fill="#02a76a">3,292</text>
  <text x="1300" y="236" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="18" font-weight="bold" fill="#02a76a">3,218</text>
  <!-- value labels: gray heap scan -->
  <text x="300" y="330" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="18" font-weight="bold" fill="#8a918d">2,531</text>
  <text x="800" y="592" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="18" font-weight="bold" fill="#8a918d">630</text>
  <text x="1300" y="668" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="18" font-weight="bold" fill="#8a918d">74</text>
  <!-- value labels: dashed reference -->
  <text x="300" y="393" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="16" fill="#8a918d">2,077</text>
  <text x="800" y="444" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="16" fill="#8a918d">1,706</text>
  <text x="1300" y="455" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="16" fill="#8a918d">1,630</text>

  <!-- note + source -->
  <text x="60" y="836" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="13" fill="#8a918d">곡선은 개념적 표현, 각 점의 값은 실측치</text>
  <text x="1540" y="836" text-anchor="end" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="13" fill="#8a918d">측정: 1,000행 반환 범위 조회 ops/sec · github.com/woonyong-kr/minidb</text>
</svg>
