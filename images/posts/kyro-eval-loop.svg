<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"
     font-family="'Noto Sans KR','Noto Sans CJK KR',sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="60" y="90" font-size="36" font-weight="bold" fill="#2f3733">판정 평가 루프 · accuracy 94.3% → 100%</text>
  <text x="60" y="130" font-size="20" fill="#6a716d">카탈로그를 역산해 골든셋을 만들고, 평가가 찾은 결함을 근본 원인까지 추적해 수정</text>

  <!-- 1. 카탈로그 -->
  <rect x="80" y="220" width="330" height="150" rx="10" fill="#f4f6f5" stroke="#8a918d" stroke-width="2"/>
  <text x="245" y="268" text-anchor="middle" font-size="24" font-weight="bold" fill="#2f3733">규칙 카탈로그</text>
  <text x="245" y="304" text-anchor="middle" font-size="20" fill="#2f3733">도메인 16종 · rule 29</text>
  <text x="245" y="336" text-anchor="middle" font-size="20" fill="#6a716d">등록 원인 87종</text>

  <line x1="410" y1="295" x2="490" y2="295" stroke="#2f3733" stroke-width="3"/>
  <polygon points="490,295 476,287 476,303" fill="#2f3733"/>
  <text x="450" y="270" text-anchor="middle" font-size="17" fill="#6a716d">역산</text>

  <!-- 2. 골든셋 -->
  <rect x="500" y="220" width="360" height="150" rx="10" fill="#f4f6f5" stroke="#8a918d" stroke-width="2"/>
  <text x="680" y="268" text-anchor="middle" font-size="24" font-weight="bold" fill="#2f3733">골든셋 자동 생성</text>
  <text x="680" y="304" text-anchor="middle" font-size="20" fill="#2f3733">장애 87 + 정상 29 = 116 시나리오</text>
  <text x="680" y="336" text-anchor="middle" font-size="19" fill="#6a716d">정상 로그와 판별 패턴의 충돌을 자체 검증</text>

  <line x1="860" y1="295" x2="940" y2="295" stroke="#2f3733" stroke-width="3"/>
  <polygon points="940,295 926,287 926,303" fill="#2f3733"/>

  <!-- 3. 평가 -->
  <rect x="950" y="220" width="330" height="150" rx="10" fill="#ffffff" stroke="#2f3733" stroke-width="2.5"/>
  <text x="1115" y="268" text-anchor="middle" font-size="24" font-weight="bold" fill="#2f3733">전 경로 평가</text>
  <text x="1115" y="304" text-anchor="middle" font-size="20" fill="#2f3733">계획 → 평가 → 원인 판정</text>
  <text x="1115" y="336" text-anchor="middle" font-size="20" fill="#6a716d">accuracy · coverage · 오탐 · 혼동 행렬</text>

  <line x1="1115" y1="370" x2="1115" y2="430" stroke="#2f3733" stroke-width="3"/>
  <polygon points="1115,430 1107,417 1123,417" fill="#2f3733"/>

  <rect x="950" y="435" width="330" height="130" rx="10" fill="#f4f6f5" stroke="#8a918d" stroke-width="2"/>
  <text x="1115" y="483" text-anchor="middle" font-size="30" font-weight="bold" fill="#6a716d">94.3% (82/87)</text>
  <text x="1115" y="520" text-anchor="middle" font-size="20" fill="#2f3733">혼동 5쌍 발견 · 오탐 0%</text>

  <!-- 결함 추적 -->
  <line x1="950" y1="500" x2="700" y2="500" stroke="#b5533c" stroke-width="3"/>
  <polygon points="700,500 714,492 714,508" fill="#b5533c"/>

  <rect x="290" y="435" width="410" height="180" rx="10" fill="#fdf6f4" stroke="#b5533c" stroke-width="2"/>
  <text x="495" y="483" text-anchor="middle" font-size="23" font-weight="bold" fill="#b5533c">결함 5건, 근본 원인 추적</text>
  <text x="495" y="519" text-anchor="middle" font-size="20" fill="#2f3733">넓은 패턴이 좁은 패턴을 잠식</text>
  <text x="495" y="551" text-anchor="middle" font-size="20" fill="#2f3733">동점이면 선언 순서로 승패가 갈림</text>
  <text x="495" y="587" text-anchor="middle" font-size="19" fill="#6a716d">→ 패턴 4곳 분해 · 신호 그룹 신설 · tie-break 개선</text>

  <line x1="290" y1="525" x2="245" y2="525" stroke="#b5533c" stroke-width="3"/>
  <line x1="245" y1="525" x2="245" y2="375" stroke="#b5533c" stroke-width="3"/>
  <polygon points="245,375 237,388 253,388" fill="#b5533c"/>
  <text x="150" y="460" font-size="18" fill="#b5533c">카탈로그 · 엔진 수정</text>

  <!-- 재평가 -->
  <line x1="1280" y1="500" x2="1400" y2="500" stroke="#02a76a" stroke-width="3"/>
  <polygon points="1400,500 1386,492 1386,508" fill="#02a76a"/>
  <text x="1342" y="475" text-anchor="middle" font-size="17" fill="#027f50">재평가</text>

  <rect x="1405" y="420" width="150" height="160" rx="10" fill="#eefaf4" stroke="#02a76a" stroke-width="2.5"/>
  <text x="1480" y="485" text-anchor="middle" font-size="34" font-weight="bold" fill="#027f50">100%</text>
  <text x="1480" y="522" text-anchor="middle" font-size="20" fill="#2f3733">87/87</text>
  <text x="1480" y="554" text-anchor="middle" font-size="18" fill="#6a716d">오탐 0%</text>

  <!-- 하단 -->
  <line x1="60" y1="700" x2="1540" y2="700" stroke="#d9dde0" stroke-width="2"/>
  <text x="800" y="750" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f3733">개선 전후가 커밋 diff 로 남아 있고, 전 과정이 로컬에서 재현됩니다</text>
  <text x="800" y="786" text-anchor="middle" font-size="19" fill="#6a716d">evals/build_golden_set.py · run_eval.py · results.md</text>
</svg>
